<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <radialGradient id="ambient-orb1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambient-orb2" cx="85%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="rgba(255, 255, 255, 0.15)"/>
    </pattern>

    <!-- CSS Animation Styles -->
    <style>
      .glow-pulse {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .float-slow {
        animation: float 6s ease-in-out infinite alternate;
      }
      .float-reverse {
        animation: floatRev 7s ease-in-out infinite alternate;
      }
      .dash-anim {
        stroke-dasharray: 8, 8;
        animation: dash 15s linear infinite;
      }
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.65; transform: scale(1.02); }
      }
      @keyframes float {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatRev {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(12px) rotate(-1.5deg); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -100; }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -1.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)"/>

  <!-- Ambient Glowing Orbs (Dynamic pulse in background) -->
  <circle cx="250" cy="140" r="280" fill="url(#ambient-orb1)" class="glow-pulse"/>
  <circle cx="980" cy="280" r="320" fill="url(#ambient-orb2)" class="glow-pulse" style="animation-delay: -2s;"/>

  <!-- Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid-pattern)"/>

  <!-- Decorative Floating Background Cards / UI Builder Elements -->
  <g class="float-slow" opacity="0.6">
    <!-- UI Block 1: Left Widget Placeholder -->
    <rect x="70" y="55" width="160" height="95" rx="10" fill="#1e293b" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5"/>
    <rect x="85" y="70" width="60" height="10" rx="5" fill="#6366f1" opacity="0.8"/>
    <rect x="85" y="90" width="130" height="8" rx="4" fill="#475569" opacity="0.6"/>
    <rect x="85" y="105" width="95" height="8" rx="4" fill="#475569" opacity="0.6"/>
    <circle cx="205" cy="75" r="8" fill="#10b981" opacity="0.7"/>
  </g>

  <g class="float-reverse" opacity="0.55">
    <!-- UI Block 2: Right Builder Canvas Widget -->
    <rect x="960" y="60" width="180" height="120" rx="12" fill="#1e293b" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1.5"/>
    <circle cx="985" cy="85" r="14" fill="#ec4899" opacity="0.8"/>
    <rect x="1010" y="80" width="80" height="10" rx="5" fill="#f43f5e" opacity="0.8"/>
    <rect x="985" y="115" width="130" height="20" rx="6" fill="#334155"/>
    <rect x="985" y="145" width="90" height="12" rx="4" fill="#475569" opacity="0.7"/>
  </g>

  <!-- Connective Drag-and-Drop Connecting Arc -->
  <path d="M 230 110 C 350 150, 400 60, 520 90" fill="none" stroke="rgba(99, 102, 241, 0.3)" stroke-width="2" class="dash-anim"/>
  <path d="M 720 330 C 850 370, 920 280, 970 180" fill="none" stroke="rgba(236, 72, 153, 0.3)" stroke-width="2" class="dash-anim"/>

  <!-- Foreground Content Layer -->
  <!-- Top Badge -->
  <g transform="translate(600, 75)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
    <circle cx="-118" cy="0" r="5" fill="#10b981"/>
    <text text-anchor="middle" y="5" fill="#e2e8f0" class="badge-text">⚡ Curated Ecosystem &amp; Market Guide</text>
  </g>

  <!-- Main Title -->
  <text class="title-text" text-anchor="middle" x="600" y="165" font-size="54" fill="url(#primary-glow)">
    Drag-and-Drop Website Builders
  </text>

  <!-- Subtitle -->
  <text class="sub-text" text-anchor="middle" x="600" y="215" font-size="21" fill="#cbd5e1">
    SaaS Market Leaders &amp; Open-Source Self-Hosted Frameworks
  </text>

  <!-- Secondary Description Line -->
  <text class="sub-text" text-anchor="middle" x="600" y="250" font-size="15" fill="#94a3b8">
    Visual Canvas • No-Code Design • Zero Vendor Lock-in • Static Site Generators
  </text>

  <!-- Bottom Interactive Pill Highlights (Tags) -->
  <g transform="translate(600, 320)">
    <!-- Pill 1 -->
    <g transform="translate(-360, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1.2"/>
      <text text-anchor="middle" y="5" fill="#a5b4fc" class="badge-text">🚀 SaaS Titans</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-180, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="1.2"/>
      <text text-anchor="middle" y="5" fill="#67e8f9" class="badge-text">⭐ Open Source</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(0, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="1.2"/>
      <text text-anchor="middle" y="5" fill="#d8b4fe" class="badge-text">🎨 Visual Canvas</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(180, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="rgba(236, 72, 153, 0.15)" stroke="#ec4899" stroke-width="1.2"/>
      <text text-anchor="middle" y="5" fill="#f472b6" class="badge-text">📦 Self-Hosted</text>
    </g>
    <!-- Pill 5 -->
    <g transform="translate(360, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.2"/>
      <text text-anchor="middle" y="5" fill="#6ee7b7" class="badge-text">⚡ Zero Lock-in</text>
    </g>
  </g>

  <!-- Bottom Accent Border Glow -->
  <line x1="100" y1="418" x2="1100" y2="418" stroke="url(#primary-glow)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
</svg>
